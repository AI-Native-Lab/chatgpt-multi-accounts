<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ChatGPT Multi-Accounts app icon: three chat windows open at once, each with its own
       account. Master artwork on the macOS grid, an 824 px body centred on a 1024 px canvas.
       Render with assets/icon/make-icons.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C493"/>
      <stop offset="1" stop-color="#0A6B57"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="120" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.20  0 0 0 0 0.15  0 0 0 0.40 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <path d="M382.8 100.0 H641.2 C722.6 100.0 763.3 100.0 800.1 112.1 L807.2 113.9 C855.0 131.3 892.7 169.0 910.1 216.8 L911.9 223.9 C924.0 260.7 924.0 301.4 924.0 382.8 V641.2 C924.0 722.6 924.0 763.3 911.9 800.1 L910.1 807.2 C892.7 855.0 855.0 892.7 807.2 910.1 L800.1 911.9 C763.3 924.0 722.6 924.0 641.2 924.0 H382.8 C301.4 924.0 260.7 924.0 223.9 911.9 L216.8 910.1 C169.0 892.7 131.3 855.0 113.9 807.2 L112.1 800.1 C100.0 763.3 100.0 722.6 100.0 641.2 V382.8 C100.0 301.4 100.0 260.7 112.1 223.9 L113.9 216.8 C131.3 169.0 169.0 131.3 216.8 113.9 L223.9 112.1 C260.7 100.0 301.4 100.0 382.8 100.0 Z" fill="url(#bg)"/>
    <path d="M382.8 100.0 H641.2 C722.6 100.0 763.3 100.0 800.1 112.1 L807.2 113.9 C855.0 131.3 892.7 169.0 910.1 216.8 L911.9 223.9 C924.0 260.7 924.0 301.4 924.0 382.8 V641.2 C924.0 722.6 924.0 763.3 911.9 800.1 L910.1 807.2 C892.7 855.0 855.0 892.7 807.2 910.1 L800.1 911.9 C763.3 924.0 722.6 924.0 641.2 924.0 H382.8 C301.4 924.0 260.7 924.0 223.9 911.9 L216.8 910.1 C169.0 892.7 131.3 855.0 113.9 807.2 L112.1 800.1 C100.0 763.3 100.0 722.6 100.0 641.2 V382.8 C100.0 301.4 100.0 260.7 112.1 223.9 L113.9 216.8 C131.3 169.0 169.0 131.3 216.8 113.9 L223.9 112.1 C260.7 100.0 301.4 100.0 382.8 100.0 Z" fill="url(#glow)"/>
  </g>

  <!-- Three accounts' windows, all open: back left, middle, front right. -->
  <g filter="url(#cardShadow)">
    <rect x="178" y="226" width="404" height="330" rx="56" fill="#FFFFFF" fill-opacity="0.62"/>
  </g>
  <circle cx="242" cy="290" r="30" fill="#F08A4B"/>
  <rect x="290" y="278" width="150" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9"/>

  <g filter="url(#cardShadow)">
    <rect x="310" y="342" width="404" height="330" rx="56" fill="#FFFFFF" fill-opacity="0.86"/>
  </g>
  <circle cx="374" cy="406" r="30" fill="#8B5CF6"/>
  <rect x="422" y="394" width="150" height="24" rx="12" fill="#D9E6E1"/>

  <g filter="url(#cardShadow)">
    <rect x="442" y="458" width="404" height="330" rx="56" fill="#FFFFFF"/>
  </g>
  <circle cx="506" cy="522" r="30" fill="#3B82F6"/>
  <rect x="554" y="510" width="150" height="24" rx="12" fill="#D9E6E1"/>
  <rect x="482" y="588" width="236" height="58" rx="29" fill="#E6EFEC"/>
  <rect x="566" y="668" width="236" height="58" rx="29" fill="#BFE9DA"/>
</svg>
